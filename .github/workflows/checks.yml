name: Source and correctness checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ make libgsl-dev libboost-dev
      - name: Build ArithDiag-LS
        run: make -C ArithDiag-LS/native -j2
      - name: Verify source and exact semantics
        run: python -B tools/check.py --native
