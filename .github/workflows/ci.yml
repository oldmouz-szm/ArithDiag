name: source-smoke
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgsl-dev libboost-dev
      - name: Build and validate
        run: make -j1 test PYTHON=python3
      - name: Check source release
        run: python3 -B scripts/check_release.py
